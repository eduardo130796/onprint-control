# Ambiente de desenvolvimento: 3 containers (db, api, web).
# Os node_modules ficam em volumes (instalados uma vez pelo container da API e compartilhados com o web).
name: onprint-control

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    working_dir: /app
    env_file: .env
    environment:
      NODE_ENV: development
      # Volume do Windows não propaga eventos de arquivo: hot reload por polling (1 s)
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    command: >
      sh -c "npm install --no-audit --no-fund &&
             npm run prisma:generate -w @onprint/api &&
             npm run prisma:migrar -w @onprint/api &&
             npm run prisma:seed -w @onprint/api &&
             npm run dev -w @onprint/api"
    ports:
      - "127.0.0.1:3333:3333"
    volumes:
      - .:/app
      - uploads:/app/uploads
      - node_modules:/app/node_modules
      - node_modules_api:/app/apps/api/node_modules
      - node_modules_web:/app/apps/web/node_modules
      - node_modules_shared:/app/packages/shared/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      # A primeira subida instala as dependências; pode levar alguns minutos
      start_period: 600s

  web:
    image: node:22-alpine
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://api:3333
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev -w @onprint/web -- --host 0.0.0.0
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - node_modules_api:/app/apps/api/node_modules
      - node_modules_web:/app/apps/web/node_modules
      - node_modules_shared:/app/packages/shared/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  node_modules:
  node_modules_api:
  node_modules_web:
  node_modules_shared:
